<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; font-family: Arial, sans-serif; background: #eef4f0; color: #24332b; }
    header { text-align: center; margin-bottom: 22px; }
    header h1 { margin-bottom: 8px; color: #176b45; }
    header p { color: #617267; }
    form { max-width: 560px; margin: auto; padding: 26px; background: #fff; border-radius: 14px; box-shadow: 0 8px 24px #173d2514; }
    .field { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select { width: 100%; padding: 11px 12px; border: 1px solid #cbd7ce; border-radius: 7px; font-size: 15px; }
    input:focus, select:focus { outline: 2px solid #a3d6b8; border-color: #218653; }
    button { width: 100%; padding: 12px; background: #187648; border: 0; border-radius: 7px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    button:hover { background: #105b36; }
    .hint { text-align: center; margin-top: 16px; }
    a { color: #176b45; }
  </style>
</head>
<body>
  <header>
    <h1>Student Registration</h1>
  </header>
  <form action="/server" method="POST">
    <div class="field"><label for="name">Full Name</label><input id="name" name="name" type="text" required minlength="3" autocomplete="name" placeholder="Enter your full name"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters"></div>
    <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" required min="1" max="120" placeholder="Enter your age"></div>
    <div class="field"><label for="mobile">Mobile Number</label><input id="mobile" name="mobile" type="tel" required pattern="[0-9]{10}" title="Enter a 10-digit mobile number" placeholder="10-digit mobile number"></div>
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="email" placeholder="name@example.com"></div>
    <div class="field"><label for="gender">Gender</label><select id="gender" name="gender" required><option value="">Choose gender</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></div>
    <div class="field"><label for="state">State</label><input id="state" name="state" type="text" required placeholder="Enter your state"></div>
    <div class="field"><label for="skills">Skills</label><input id="skills" name="skills" type="text" required placeholder="e.g. HTML, CSS, JavaScript"></div>
    <button type="submit">Register</button>
    <p class="hint"><a href="/server">View registered users</a></p>
  </form>
</body>
</html>
